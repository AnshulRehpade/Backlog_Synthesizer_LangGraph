[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backlog-synthesizer-langgraph"
version = "0.1.0"
description = "LangGraph migration of the Backlog Synthesizer multi-agent system."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "MIT"

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.5.0,<3.0.0",
    "chromadb>=0.5.0",
    "pymupdf>=1.23.0,<2.0.0",
    "openai>=1.10.0",
    "anthropic>=0.39.0",
    "sentence-transformers>=2.2.0,<4.0.0",
    "tiktoken>=0.5.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
otel = ["opentelemetry-exporter-otlp>=1.20.0"]
sqlite = ["langgraph-checkpoint-sqlite>=1.0.0"]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
    "hypothesis>=6.92.0,<7.0.0",
    "mypy>=1.8.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_synthesizer_langgraph"]

[tool.hatch.build.targets.editable]
packages = ["src/backlog_synthesizer_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src --cov=graph --cov=nodes --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hypothesis]
max_examples = 100
